{# Estrutura comum da interface; as páginas inserem conteúdo e scripts nos blocos. #}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Data Forge</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', path='img/weather.png') }}">
</head>
<body>
    <header>
        <h1><a href="/">Data Forge</a></h1>
        <nav class="tabs">
            <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Tabela</a>
            <a href="/map" class="{{ 'active' if request.url.path == '/map' else '' }}">Mapa</a>
            <a href="/import" class="{{ 'active' if request.url.path == '/import' else '' }}">Importar</a>
        </nav>
    </header>
    {% include "file-list.html" %}
    <main>
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
