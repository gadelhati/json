{% extends "base.html" %}
{% block content %}
<h2>Importar JSON ou GeoJSON</h2>
<form method="post" action="/import" enctype="multipart/form-data">
    <input type="file" name="file" accept="application/json,application/geo+json,.json,.geojson" required>
    <button type="submit">Importar</button>
</form>
{% endblock %}
