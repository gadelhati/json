{% extends "base.html" %}

{% block content %}

<h1 class="mb-4">Editor de JSON</h1>

<form
    action="{{ url_for('upload') }}"
    method="post"
    enctype="multipart/form-data"
>

    <div class="mb-3">

        <label
            for="file"
            class="form-label"
        >
            Arquivo JSON
        </label>

        <input
            type="file"
            class="form-control"
            id="file"
            name="file"
            accept=".json"
            required
        >

    </div>

    <button
        type="submit"
        class="btn btn-primary"
    >
        Carregar JSON
    </button>

</form>

{% endblock %}
